server.port=${PORT:8080}

# Microsoft SQL Server Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:team_workspace_portal};encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration (Minimum 256-bit secret key)
app.jwt.secret=${JWT_SECRET:DayLaKhoaBiMatMacDinhChoDoAnTotNghiep2026CanDuDai32KyTuVaBaoMatTuyetDoi}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Upload Configuration
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
